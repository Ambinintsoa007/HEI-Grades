<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEI Grades - Admin</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
  </head>
  <body>
    <div class="header">
      <h1>HEI Grades</h1>
      <div class="row">
        <a class="btn-secondary" href="/web/login">Changer de compte</a>
        <span class="role-badge">ADMIN</span>
      </div>
    </div>
    <div class="container">
      <h2>Bonjour, Admin</h2>
      <div class="message" id="message-box"></div>

      <div class="card">
        <h2>Promotions</h2>
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Années</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="promotion : ${promotions}">
              <td th:text="${promotion.name}"></td>
              <td th:text="${promotion.startYear + ' - ' + promotion.endYear}"></td>
              <td class="row">
                <button
                  class="btn-secondary"
                  th:attr="data-promotion-id=${promotion.id}"
                  onclick="showResults(this)"
                >
                  Résultats
                </button>
                <button
                  class="btn"
                  th:attr="data-promotion-id=${promotion.id}"
                  onclick="downloadGraduates(this)"
                >
                  Télécharger diplômés
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card" id="results-card" style="display: none">
        <h2 id="results-title">Résultats</h2>
        <div id="results-container"></div>
      </div>

      <div class="card">
        <h2>Créer un utilisateur</h2>
        <form id="user-form">
          <div class="form-group">
            <label for="user-role">Rôle</label>
            <select id="user-role">
              <option value="STUDENT">Étudiant</option>
              <option value="TEACHER">Enseignant</option>
            </select>
          </div>
          <div class="row">
            <div class="form-group">
              <label for="user-firstname">Prénom</label>
              <input type="text" id="user-firstname" required />
            </div>
            <div class="form-group">
              <label for="user-lastname">Nom</label>
              <input type="text" id="user-lastname" required />
            </div>
          </div>
          <div class="row">
            <div class="form-group">
              <label for="user-email">Email</label>
              <input type="email" id="user-email" required />
            </div>
            <div class="form-group">
              <label for="user-password">Mot de passe</label>
              <input type="password" id="user-password" required />
            </div>
          </div>
          <div class="row" id="student-fields">
            <div class="form-group">
              <label for="user-std">N° étudiant (STD)</label>
              <input type="text" id="user-std" />
            </div>
            <div class="form-group">
              <label for="user-promotion">Promotion</label>
              <select id="user-promotion">
                <option
                  th:each="promotion : ${promotions}"
                  th:value="${promotion.id}"
                  th:text="${promotion.name + ' (' + promotion.startYear + ' - ' + promotion.endYear + ')'}"
                ></option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn">Créer l'utilisateur</button>
        </form>
      </div>
    </div>
    <script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (!requireRole('ADMIN')) return;
        var roleSelect = document.getElementById('user-role');
        roleSelect.addEventListener('change', toggleStudentFields);
        toggleStudentFields();
        document.getElementById('user-form').addEventListener('submit', createUser);
      });

      function toggleStudentFields() {
        var isStudent = document.getElementById('user-role').value === 'STUDENT';
        document.getElementById('student-fields').style.display = isStudent ? 'flex' : 'none';
        document.getElementById('user-std').required = isStudent;
      }

      async function createUser(event) {
        event.preventDefault();
        clearMessage();
        var isStudent = document.getElementById('user-role').value === 'STUDENT';
        var body = {
          firstName: document.getElementById('user-firstname').value,
          lastName: document.getElementById('user-lastname').value,
          email: document.getElementById('user-email').value,
          password: document.getElementById('user-password').value,
          role: document.getElementById('user-role').value,
        };
        if (isStudent) {
          body.std = document.getElementById('user-std').value;
          body.promotionId = document.getElementById('user-promotion').value;
        }
        try {
          var response = await apiFetch('/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (response.status === 201) {
            showMessage('Utilisateur créé avec succès.', 'success');
            document.getElementById('user-form').reset();
            toggleStudentFields();
          } else if (response.status === 403) {
            showMessage('Action non autorisée', 'forbidden');
          } else {
            var data = null;
            try {
              data = await response.json();
            } catch (e) {}
            showMessage(
              data && data.message ? data.message : "Impossible de créer l'utilisateur.",
              'error'
            );
          }
        } catch (error) {}
      }

      async function showResults(button) {
        clearMessage();
        var promotionId = button.dataset.promotionId;
        try {
          var response = await apiFetch('/promotions/' + promotionId + '/results');
          if (!response.ok) {
            if (response.status === 403) {
              showMessage('Action non autorisée', 'forbidden');
            } else {
              showMessage('Impossible de charger les résultats.', 'error');
            }
            return;
          }
          renderResults(await response.json());
        } catch (error) {}
      }

      function renderResults(results) {
        var container = document.getElementById('results-container');
        var card = document.getElementById('results-card');
        card.style.display = 'block';
        document.getElementById('results-title').textContent =
          'Résultats - ' + results.promotionId;
        if (!results.students || results.students.length === 0) {
          container.innerHTML =
            '<p class="muted">Aucun étudiant dans cette promotion.</p>';
          return;
        }
        var html =
          '<table><thead><tr>' +
          '<th>N° étudiant</th><th>Nom</th><th>Diplômé</th><th>Complet</th><th>Crédits</th>' +
          '<th>Moyennes par année</th></tr></thead><tbody>';
        results.students.forEach(function (s) {
          var credits = s.academicYears.reduce(function (sum, y) {
            return sum + y.earnedCredits;
          }, 0);
          var years = s.academicYears
            .map(function (y) {
              return escapeHtml(y.academicYearLabel) + ': ' + (y.average != null ? y.average : '—');
            })
            .join(', ');
          html +=
            '<tr><td>' + escapeHtml(s.std) + '</td><td>' + escapeHtml(s.firstName) + ' ' + escapeHtml(s.lastName) + '</td>' +
            '<td>' + (s.graduate ? 'Oui' : 'Non') + '</td><td>' + (s.complete ? 'Oui' : 'Non') + '</td>' +
            '<td>' + credits + '</td><td>' + years + '</td></tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      }

      async function downloadGraduates(button) {
        clearMessage();
        var token = getToken();
        if (!token) {
          window.location.href = '/web/login';
          return;
        }
        try {
          var response = await fetch(
            '/promotions/' + button.dataset.promotionId + '/graduates.xlsx',
            { headers: { Authorization: 'Bearer ' + token } }
          );
          if (response.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = '/web/login';
            return;
          }
          if (!response.ok) {
            if (response.status === 403) {
              showMessage('Action non autorisée', 'forbidden');
            } else {
              showMessage('Téléchargement impossible : ' + response.status, 'error');
            }
            return;
          }
          var blob = await response.blob();
          var filename = filenameFromContentDisposition(
            response.headers.get('Content-Disposition')
          );
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = filename || 'graduates.xlsx';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (error) {}
      }

      function filenameFromContentDisposition(header) {
        if (!header) return null;
        var encoded = /filename\*=UTF-8''([^;]+)/i.exec(header);
        if (encoded) {
          try {
            return decodeURIComponent(encoded[1].trim());
          } catch (e) {}
        }
        var plain = /filename="?([^";]+)"?/i.exec(header);
        return plain ? plain[1].trim() : null;
      }

      function escapeHtml(value) {
        var div = document.createElement('div');
        div.textContent = value;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
